name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run verify:seo
      - name: Build against deterministic mock API
        run: |
          node scripts/mock-api.mjs > /tmp/songdian-mock-api.log 2>&1 &
          MOCK_PID=$!
          trap 'kill $MOCK_PID' EXIT
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then
              MOCK_READY=1
              break
            fi
            sleep 0.25
          done
          test "$MOCK_READY" = "1"
          NEXT_PUBLIC_API_URL=http://127.0.0.1:8000 npm run build
      - run: npm audit --omit=dev --package-lock-only --audit-level=high

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --package-lock-only --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile tools config -q
      - run: bash -n scripts/backup.sh scripts/deploy.sh scripts/smoke-deploy.sh

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: songdian
          POSTGRES_PASSWORD: songdian-ci
          POSTGRES_DB: songdian_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U songdian -d songdian_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://songdian:songdian-ci@127.0.0.1:5432/songdian_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_REQUIRED: "true"
      APP_ENV: production
      JWT_SECRET: ci-jwt-secret-at-least-thirty-two-bytes
      ADMIN_PASSWORD: ci-admin-password
      CORS_ORIGINS: https://www.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev --frozen
      - run: uv run aerich upgrade
      - name: Verify production readiness with PostgreSQL and Redis
        run: |
          uv run uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/backend-integration.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID; cat /tmp/backend-integration.log' EXIT
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then
              READY=1
              break
            fi
            sleep 0.5
          done
          test "$READY" = "1"

  images:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend, frontend, admin, compose, migration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - component: backend
            image: backend
          - component: frontend
            image: frontend
          - component: admin-next
            image: admin
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.zsaki.icu' }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://www.zsaki.icu' }}
            NEXT_PUBLIC_IMAGE_HOST=${{ vars.NEXT_PUBLIC_IMAGE_HOST || 'api.zsaki.icu' }}
            BACKEND_PROXY_URL=http://backend:8000
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
