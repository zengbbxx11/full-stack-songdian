[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aerich>=0.9.3",
    "aiocache>=0.12.3",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.139.2",
    "python-dotenv>=1.2.2",
    "redis>=8.0.1",
    "tortoise-orm[asyncpg]>=1.1.7",
    "uvicorn[standard]>=0.51.0",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "bleach>=6.1",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "tzdata>=2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.aerich]
tortoise_orm = "common.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "."

[tool.ruff]
line-length = 100
extend-exclude = [".venv", ".idea"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
