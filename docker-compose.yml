# 松典 B2B 全栈 —— Docker Compose 全栈编排（应用 + PG + Redis 全部进 Compose）
#
# 架构：应用三服务（backend/frontend/admin-next）+ 数据两层（postgres/redis）
# 全部由本 Compose 编排、构建镜像、保活。
# 仅 1Panel 的 OpenResty 留在 Compose 之外，负责外部反代：
#  生产域名：
#   https://www.zsaki.icu   → frontend:3000
#   https://admin.zsaki.icu → admin-next:3001
#   https://api.zsaki.icu   → backend:8000
#   https://zsaki.icu       → HTTPS 301 至 https://www.zsaki.icu
# OpenResty 以 host 网络模式运行，反代目标写 http://127.0.0.1:8000 / :3000 / :3001
# （Compose 已把这三个端口发布到宿主机回环）。
#
# 用法：
#   1) 复制本目录 .env.example 为 .env，填入真实密钥与生产域名配置
#   2) docker compose build
#   3) docker compose up -d
#   4) 首次部署按「六、导入数据」导入种子（aerich 已建表，业务数据按需导入）

name: songdian-b2b

services:
  # ───────────────────────── 数据库 PostgreSQL（官方镜像，不自定义扩展） ─────────────────────────
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      # 数据持久化（容器重建/升级不丢）
      # PG 18 镜像要求挂 /var/lib/postgresql（内部按 major 版本分子目录），挂旧路径 /var/lib/postgresql/data 会启动失败
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-net
    # 默认不发布到宿主机，仅内部（backend）经服务名 postgres:5432 访问。
    # 如需宿主机直连排查，临时加：ports: ["127.0.0.1:5432:5432"]

  # ───────────────────────── 缓存/限流 Redis ─────────────────────────
  redis:
    image: redis:8.8.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-net

  # ───────────────────────── 后端 API ─────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-songdian-backend:local}
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # 连接 Compose 内 postgres / redis 服务（Docker 内置 DNS，服务名即主机名）
      # 注意：Tortoise-ORM 认 postgres://（asyncpg），不认 postgresql:// 前缀
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: HS256
      APP_ENV: production
      OPENAPI_DOCS_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      # 留空时启动脚本自动识别 Docker 网桥网关；如网络拓扑不同可在 .env 显式覆盖。
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SECURITY_FAIL_CLOSED: "true"
      NEXT_REVALIDATE_URL: http://frontend:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      SEED_ON_START: ${SEED_ON_START:-false}
      SEED_CONTENT_CATEGORIES: ${SEED_CONTENT_CATEGORIES:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MEDIA_ROOT: uploads_data
      MEDIA_URL: /uploads
      HOST: 0.0.0.0
      PORT: "8000"
      MAX_UPLOAD_MB: "10"
      MAX_UPLOAD_FILES: "20"
      MAX_UPLOAD_TOTAL_MB: "100"
      STORAGE_BACKEND: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 上传文件数据卷：挂到独立数据目录 uploads_data/（与代码模块 uploads/ 分离，
      # 否则卷会遮住镜像里的 uploads/models.py 等代码 → Module not found）
      - uploads_data:/app/backend/uploads_data
    # 迁移由 migrate 一次性服务显式执行；这里只同步内置图片并启动 uvicorn。
    command: >
      sh -c "mkdir -p uploads_data && (cp -rn uploads/. uploads_data/ 2>/dev/null || true) &&
      exec sh ./scripts/start.sh"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/readyz'); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-net

  # ───────────────────────── 企业官网 ─────────────────────────
  migrate:
    image: ${BACKEND_IMAGE:-songdian-backend:local}
    build:
      context: ./backend
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: production
    command: ["aerich", "upgrade"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-net

  frontend:
    image: ${FRONTEND_IMAGE:-songdian-frontend:local}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.zsaki.icu}
        NEXT_PUBLIC_IMAGE_HOST: ${NEXT_PUBLIC_IMAGE_HOST:-api.zsaki.icu}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
      INTERNAL_API_URL: http://backend:8000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-net

  # ───────────────────────── 管理后台 ─────────────────────────
  admin-next:
    image: ${ADMIN_IMAGE:-songdian-admin:local}
    build:
      context: ./admin-next
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        BACKEND_PROXY_URL: http://backend:8000
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_PROXY_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/signin',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-net

volumes:
  pg_data:
  redis_data:
  uploads_data:

networks:
  app-net:
    driver: bridge
