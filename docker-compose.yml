# 松典 B2B 全栈 —— Docker Compose 全栈编排（应用 + PG + Redis 全部进 Compose）
#
# 架构：应用三服务（backend/frontend/admin-next）+ 数据两层（postgres/redis）
# 全部由本 Compose 编排、构建镜像、保活。
# 仅 1Panel 的 OpenResty 留在 Compose 之外，负责外部反代：
#  有域名：                     仅 IP（无域名）：
#   https://www.songdian.tech   → frontend:3000        http://106.53.220.184/        → frontend:3000
#   https://admin.songdian.tech → admin-next:3001     http://106.53.220.184:8081/   → OpenResty → admin-next:3001
#   https://api.songdian.tech   → backend:8000        http://106.53.220.184/api/    → backend:8000
# OpenResty 以 host 网络模式运行，反代目标写 http://127.0.0.1:8000 / :3000 / :3001
# （Compose 已把这三个端口发布到宿主机回环）。
#
# 用法：
#   1) 复制本目录 .env.example 为 .env，填入真实密钥与公网 IP/域名配置
#   2) docker compose build
#   3) docker compose up -d
#   4) 首次部署按「六、导入数据」导入种子（aerich 已建表，业务数据按需导入）

name: songdian-b2b

services:
  # ───────────────────────── 数据库 PostgreSQL（官方镜像，不自定义扩展） ─────────────────────────
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      # 数据持久化（容器重建/升级不丢）
      # PG 18 镜像要求挂 /var/lib/postgresql（内部按 major 版本分子目录），挂旧路径 /var/lib/postgresql/data 会启动失败
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-net
    # 默认不发布到宿主机，仅内部（backend）经服务名 postgres:5432 访问。
    # 如需宿主机直连排查，临时加：ports: ["127.0.0.1:5432:5432"]

  # ───────────────────────── 缓存/限流 Redis ─────────────────────────
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-net

  # ───────────────────────── 后端 API ─────────────────────────
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # 连接 Compose 内 postgres / redis 服务（Docker 内置 DNS，服务名即主机名）
      # 注意：Tortoise-ORM 认 postgres://（asyncpg），不认 postgresql:// 前缀
      DATABASE_URL: postgres://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: HS256
      APP_ENV: production
      OPENAPI_DOCS_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUSTED_PROXIES: 127.0.0.1
      SECURITY_FAIL_CLOSED: "true"
      SEED_ON_START: ${SEED_ON_START:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MEDIA_ROOT: uploads_data
      MEDIA_URL: /uploads
      HOST: 0.0.0.0
      PORT: "8000"
      MAX_UPLOAD_MB: "10"
      MAX_UPLOAD_FILES: "20"
      MAX_UPLOAD_TOTAL_MB: "100"
      STORAGE_BACKEND: local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 上传文件数据卷：挂到独立数据目录 uploads_data/（与代码模块 uploads/ 分离，
      # 否则卷会遮住镜像里的 uploads/models.py 等代码 → Module not found）
      - uploads_data:/app/backend/uploads_data
    # 启动前：aerich 升级必须成功 → 同步内置图片到数据卷（仅复制失败可忽略）→ 起 uvicorn
    command: >
      sh -c "set -e;
      aerich upgrade;
      mkdir -p uploads_data;
      cp -rn uploads/. uploads_data/ 2>/dev/null || true;
      exec uvicorn main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=127.0.0.1 --workers 4"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz'); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-net

  # ───────────────────────── 企业官网 ─────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # 为旧服务器 .env 提供 IP 默认值；配置域名后由 .env 覆盖。
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://106.53.220.184}
        NEXT_PUBLIC_IMAGE_HOST: ${NEXT_PUBLIC_IMAGE_HOST:-106.53.220.184}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-net

  # ───────────────────────── 管理后台 ─────────────────────────
  admin-next:
    build:
      context: ./admin-next
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        BACKEND_PROXY_URL: http://backend:8000
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_PROXY_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001',r=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-net

volumes:
  pg_data:
  redis_data:
  uploads_data:

networks:
  app-net:
    driver: bridge
